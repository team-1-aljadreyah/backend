
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Baghdad
      SECRET_KEY: test-secret-key-for-github-actions-ci-min-32-chars
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      SUPABASE_URL: https://mock-supabase.local
      SUPABASE_ANON_KEY: mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
      SUPABASE_STORAGE_BUCKET: lab-results
      FRONTEND_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify Testing Tools
        run: |
          python --version
          python -m pip show pytest
          python -m pip show pytest-asyncio
          python -m pip show ruff

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m compileall app database

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Automated Test Suite (Pytest)
        run: |
          python -m pytest -v --asyncio-mode=auto

      - name: Clean Up Test Artifacts
        if: always()
        run: |
          rm -f test_ci.db test_suite*.db
