[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "al-jadreyah-backend"
version = "1.0.0"
description = "Production-grade healthcare management system backend powered by FastAPI, SQLAlchemy, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Al-Jadreyah Clinic Engineering Team" }
]
keywords = [
    "fastapi",
    "healthcare",
    "clinic-management",
    "postgresql",
    "supabase",
    "asyncio",
    "pydantic",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pyjwt[crypto]>=2.15.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.31",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length handled gracefully
    "E712",  # Comparison to True/False (standard SQLAlchemy Column == True expressions)
    "E741",  # Ambiguous variable names in comprehensions
    "E402",  # Module level imports after environment overrides in test harnesses
    "F821",  # Forward references in SQLAlchemy 2.0 type annotations Mapped["Model"]
    "F401",  # Unused imports in package __init__ or route modules
    "F841",  # Unused local variables in test assertions/context
    "W291",  # Trailing whitespace
    "W293",  # Blank line whitespace
]
